                    },

                }
            }
        }

<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-surface-bright h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Top Nav suppressed as this is a transactional/full-screen view -->
<div class="z-10 flex flex-col items-center justify-between h-full py-xl w-full max-w-md mx-auto px-margin-mobile md:px-0">
<!-- Header -->
<div class="flex flex-col items-center mt-xl gap-sm">
<h1 class="font-headline-md text-headline-md text-primary font-bold">SyncSphere</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">videocam</span>
                Incoming video call...
            </p>
</div>
<!-- Avatar Area -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute w-[200px] h-[200px] rounded-full border border-primary-container pulse-ring" style="animation-delay: 0s;"></div>
<div class="absolute w-[240px] h-[240px] rounded-full border border-primary-container pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="absolute w-[280px] h-[280px] rounded-full border border-primary-container pulse-ring" style="animation-delay: 1s;"></div>
<!-- Avatar -->
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface z-10 shadow-[0_4px_20px_rgba(0,0,0,0.03),0_2px_8px_rgba(0,0,0,0.02)] bg-surface-container-high relative">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a confident woman with short dark hair wearing a modern gray blazer, set against a bright, airy office background with natural light. The styling is clean, corporate, and minimalist, fitting a premium digital serenity brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBN0pBvzVHoEt7Lbho6q7UrBxylXiIFxTaJvPIWE2gxqLVlvJdOzdFgP33C1s4W6jrI9E72BL7jUW2icK28-94XlWxLSGSz7maX1Em7urX4i3XMy-bWAlCNZe-YCR-0bCu18aKmUWPla_mkN6327_6h9VwyEJxHPPFoVF8_Gi7gv_BrOvQE3M4R4kreDRXKwnE0gkMZJvLZbDU0f6mPWx9CAD8wbOdgNV96j5yD6TK5RHmb-NqMJXujUw"/>
</div>
</div>
<!-- Caller Info -->
<div class="flex flex-col items-center gap-xs z-10">
<h2 class="font-display-lg text-display-lg text-on-surface">Elena Rodriguez</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Design Lead</p>
</div>
<!-- Action Buttons -->
<div class="flex items-center gap-xl mb-xl z-10">
<!-- Decline -->
<button class="w-16 h-16 rounded-full bg-error text-on-error flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.03),0_2px_8px_rgba(0,0,0,0.02)] hover:bg-on-error-container transition-colors duration-200">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
<!-- Accept -->
<button class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.03),0_2px_8px_rgba(0,0,0,0.02)] hover:bg-primary-container transition-colors duration-200">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call</span>
</button>
</div>
</div>
<!-- Ambient background effect -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary-fixed to-transparent w-full h-full"></div>
</body></html>
