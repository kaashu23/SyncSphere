<!DOCTYPE html>

<style>
        body { background-color: #FAFAFA; }
        .ambient-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.02); }
    </style>

<body class="h-full flex items-center justify-center font-body-md text-on-surface">
<main class="w-full max-w-md px-margin-mobile md:px-margin-desktop flex flex-col items-center">
<header class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">SyncSphere</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Set up your profile to continue.</p>
</header>
<form class="w-full flex flex-col items-center space-y-xl bg-surface-lowest ambient-shadow rounded-xl p-lg md:p-xl border border-outline-variant/30">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center overflow-hidden border-2 border-dashed border-outline-variant group-hover:border-primary transition-colors">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="photo_camera">photo_camera</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-2 shadow-sm transform translate-x-1/4 translate-y-1/4">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</div>
</div>
<div class="w-full">
<label class="sr-only" for="username">Username</label>
<div class="relative">
<input class="w-full bg-transparent border-b border-outline-variant py-sm px-xs font-title-sm text-title-sm text-on-surface focus:outline-none focus:border-primary transition-colors placeholder:text-outline-variant/70" id="username" name="username" placeholder="Choose a username" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-xs pointer-events-none">
<span class="material-symbols-outlined text-primary text-lg" data-icon="check_circle">check_circle</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs pl-xs">This is how others will see you in SyncSphere.</p>
</div>
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-sm px-lg rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 shadow-sm" type="button">
                Continue
            </button>
</form>
</main>
</body></html>
