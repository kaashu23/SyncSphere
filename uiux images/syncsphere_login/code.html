            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.02);

<body class="bg-background h-full flex items-center justify-center font-title-sm text-on-surface antialiased p-margin-mobile md:p-margin-desktop">
<main class="w-full max-w-[420px]">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-ambient p-xl flex flex-col items-center">
<!-- Logo & Header -->
<div class="flex flex-col items-center text-center mb-xl">
<img alt="SyncSphere Logo" class="w-16 h-16 rounded-lg mb-lg object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR2khGAvIsOUiJlvH4f-TNWoJfsIV1eNWLaYmoq0bAB78Nc3BTdoaweXNyygWw1LaYa4iLCG60PvNSH5ZK1qI8iaYl9jFzuhTE1ywUySPDral6j89CBP4W9SOL9JCGrPOWput4SeAeJCe4GPHWps3S8xpblyhP1NQC2XEAe6N6kHsXlGStaT7lcMOJivi56dm-faezHd86JGrsMoMfqQqmvnImy69GkDvizLegsJV4DUSV63NY5KPzAA"/>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">SyncSphere</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Chat in sync, everywhere.</p>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-sm py-3 px-4 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-fixed mb-lg">
<!-- SVG Google Icon -->
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.37 10H12V14.26H17.92C17.66 15.63 16.88 16.78 15.7 17.57V20.34H19.26C21.34 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.26 20.34L15.7 17.57C14.73 18.23 13.48 18.63 12 18.63C9.14 18.63 6.71 16.71 5.84 14.12H2.17V16.97C3.98 20.57 7.7 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.12C5.62 13.46 5.49 12.75 5.49 12C5.49 11.25 5.62 10.54 5.84 9.88V7.03H2.17C1.43 8.5 1 10.2 1 12C1 13.8 1.43 15.5 2.17 16.97L5.84 14.12Z" fill="#FBBC05"></path>
<path d="M12 5.38C13.62 5.38 15.06 5.94 16.2 7.02L19.33 3.89C17.45 2.13 14.97 1 12 1C7.7 1 3.98 3.43 2.17 7.03L5.84 9.88C6.71 7.29 9.14 5.38 12 5.38Z" fill="#EA4335"></path>
</svg>
<span class="font-body-md text-body-md font-medium text-on-surface">Continue with Google</span>
</button>
<!-- Divider -->
<div class="w-full flex items-center gap-md mb-lg">
<div class="flex-1 h-px bg-outline-variant opacity-50"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">or</span>
<div class="flex-1 h-px bg-outline-variant opacity-50"></div>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant sr-only" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" style="font-variation-settings: 'opsz' 20;">mail</span>
<input class="w-full pl-10 pr-3 py-3 bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="email" placeholder="Email address" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs mb-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant sr-only" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" style="font-variation-settings: 'opsz' 20;">lock</span>
<input class="w-full pl-10 pr-3 py-3 bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="password" placeholder="Password" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-body-md text-body-md font-medium hover:bg-primary-container transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                    Log In
                </button>
</form>
<!-- Footer Links -->
<div class="mt-xl flex flex-col items-center gap-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot password?</a>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-primary hover:text-primary-container font-medium transition-colors duration-200" href="#">Sign up</a>
</p>
</div>
</div>
</main>
</body></html>
