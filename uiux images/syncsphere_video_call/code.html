<!-- Main Video Container -->
<main class="relative flex-1 w-full h-full p-4 md:p-margin-desktop bg-surface flex flex-col justify-center items-center">
<!-- Remote Video Feed (Full Screen rounded) -->
<div class="relative w-full h-full bg-surface-container-low rounded-xl overflow-hidden shadow-soft flex items-center justify-center">
<img alt="Remote participant video feed" class="absolute inset-0 w-full h-full object-cover rounded-xl" data-alt="A high-quality, professional video call feed showing a young female professional in a modern, well-lit minimalist home office. She is smiling and looking directly at the camera. The background features a tidy desk, a green plant, and soft natural light. The overall aesthetic is calm, corporate, and clean with a light-mode friendly palette of soft whites, grays, and muted wood tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuASGwVWXAe18NENsIxWfyZdFE5Xpk8bT51oze6Jvr_BVd58empCrKVtJ7osY-eWyOKlzkQtzkxqg2a7Z0LayPZIrIKLBQNHwQQJrNJUuahGpP6ayheI1cnQvl4xCar5giVZRV50hgB7Upj1mwCk1Q8vfI0kQ7x2C6kUQfRloufwoo9za8SuPoyPIjyUltIOnjqMg5c0Jz5OAzpcc8-7P4jVE4ttk-y5o_h46KfL-0zwskcjTHZDuQTNSw"/>

<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">volume_up</span>
<span class="font-title-sm text-title-sm text-on-surface">Alex Mercer</span>
</div>
</div>
<!-- Floating Self View -->
<div class="absolute bottom-24 right-4 md:bottom-32 md:right-margin-desktop w-32 h-48 md:w-48 md:h-64 bg-surface-container rounded-lg overflow-hidden shadow-soft border-2 border-surface border-opacity-50 z-10 transition-transform hover:scale-105 cursor-pointer">
<img alt="Self video feed" class="w-full h-full object-cover" data-alt="A small picture-in-picture video feed showing a young male professional in a bright, modern office space. He is wearing a simple casual shirt, looking slightly off-camera. The lighting is soft and even, matching the minimal, high-end corporate aesthetic of a high-quality webcam feed." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOCIkbSa-f4wvXVoVi8Ln7Tm1YwWx9OUtskImxvoSyFLo45qa9IWa2uaxyk-vdWLO0tJ2KmIIcM6WOR-T08zOnNjqUkgw0B5v8v0wW1BPpO9pR8cVWD1I7B9ZfUuHpRzPBUdi-ROP53Jvl3U0qjCMC3C2pvCCna8rrmWienHhzLWQ8lPCts1j8w8_W0FucpoYqErYKqZqZz_3a9rB8sOS9hVvgNBSpvqvsl4oGPVvU3W8MQXaQbazGQw"/>

<!-- Mute Button -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant hover:text-primary group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-150" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
<!-- Camera Button -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant hover:text-primary group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-150" style="font-variation-settings: 'FILL' 0;">videocam</span>
</button>
<!-- Screen Share Button -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant hover:text-primary group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-150" style="font-variation-settings: 'FILL' 0;">screen_share</span>
</button>
<div class="w-px h-8 bg-outline-variant mx-2"></div>

<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full bg-error text-on-error hover:bg-error/90 transition-colors duration-200 shadow-sm group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-150" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
